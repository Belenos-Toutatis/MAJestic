name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build portable executable
        run: cargo build --release -p majestic --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/MAJestic.exe dist/MAJestic.exe
          $hash = (Get-FileHash dist/MAJestic.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MAJestic.exe" | Out-File -Encoding ascii dist/MAJestic.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MAJestic
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
