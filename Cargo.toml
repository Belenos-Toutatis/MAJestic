[workspace]
resolver = "2"
members = ["crates/core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Emmanuel Wenner"]
repository = "https://github.com/OWNER/MAJestic"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
